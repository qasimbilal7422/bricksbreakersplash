let chances=3,lt=0,lasers=[],rk=[],rt=0,bolts=[],adT=0,PW={fire:0,laser:0,slow:0,shield:0,rocket:0},st='menu',score=0,lvl=1,lives=3,combo=0,run=0,bricks=[],balls=[],items=[],parts=[],texts=[],shk=0,ts=1,tsT=0,flash=0,tx=W/2,launchT=0,T=0,banner=0,bannerTxt='';

function start(){const p=prof();score=0;lvl=1;lives=Math.max(1,3+DFS[dif].l+(p.xl?1:0));combo=0;run=0;chances=3;lasers=[];rk=[];bolts=[];clearInterval(adT);PW={fire:0,laser:0,slow:0,shield:0,rocket:0};p.bo=p.bo||{};p.sel=p.sel||{};for(const k of['fire','laser','shield'])if(p.sel[k]&&p.bo[k]>0){p.bo[k]--;PW[k]=k=='shield'?15:7;if(!p.bo[k])p.sel[k]=0}saveP();items=[];parts=[];texts=[];pad.w=DFS[dif].pw;pad.wide=0;pad.x=tx=W/2;build();newBall();st='play';ui.classList.add('h');pb.style.display='block';banner=1.2;bannerTxt='BLAST!'}
function say(s,X,Y,c){texts.push({s,x:X,y:Y,l:1,c:c||'#fff'})}

function revive(){chances--;lives=1;combo=0;items=[];lasers=[];rk=[];PW.shield=5;newBall();st='play';ui.classList.add('h');pb.style.display='block';banner=1.3;bannerTxt='SECOND WIND!'}

/* ---------- update ---------- */
function upd(dt){
const k=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);if(k)tx+=k*720*dt;
pad.w+=((pad.wide>0?DFS[dif].pw+56:DFS[dif].pw)-pad.w)*Math.min(1,dt*10);pad.wide-=dt;tx=cl(tx,pad.w/2,W-pad.w/2);pad.x+=(tx-pad.x)*Math.min(1,dt*35);pad.sq=Math.max(0,pad.sq-dt*5);for(const k in PW)PW[k]=Math.max(0,PW[k]-dt);

for(let i=rk.length-1;i>=0;i--){const r=rk[i];

for(let i=balls.length-1;i>=0;i--){const b=balls[i];
if(b.stuck){b.x=pad.x;b.y=pad.y-pad.h/2-b.r;launchT-=dt;if(launchT<=0)launch(b);continue}
const f=PW.slow>0?.6:1,sp=Math.hypot(b.vx,b.vy)*f,n=Math.ceil(sp*dt/4),h=dt/n*f;

if(b.y<52+b.r){b.y=52+b.r;b.vy=Math.abs(b.vy);snd(560,.04,'triangle',.03)}
if(b.vy>0&&b.y+b.r>=pad.y-pad.h/2&&b.y-b.r<=pad.y+pad.h/2&&Math.abs(b.x-pad.x)<pad.w/2+b.r){const a=cl((b.x-pad.x)/(pad.w/2),-1,1)*1.05,s=speed();b.vx=Math.sin(a)*s;b.vy=-Math.cos(a)*s;b.y=pad.y-pad.h/2-b.r;pad.sq=1;combo=0;shk=Math.max(shk,2);burst(b.x,b.y,190,6,140);snd(160,.08,'sine',.08,90)}

function rr(a,b,w,h,r){x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h);x.fill()}

for(const b of balls){x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(b.x+3,b.y+10,b.r,b.r*.5,0,0,6.3);x.fill();

if(PW.shield>0&&(PW.shield>3||T*8%2<1)){const sg=x.createLinearGradient(0,H-44,0,H-28);sg.addColorStop(0,'rgba(125,255,154,0)');sg.addColorStop(1,'rgba(125,255,154,.5)');x.fillStyle=sg;x.fillRect(0,H-44,W,16);x.fillStyle='#b9ffc8';x.fillRect(0,H-30,W,3)}
if(st=='play'){let cx=8;x.font='bold 10px sans-serif';x.textAlign='left';const A=[...Object.keys(CH).map(k=>[k,PW[k],MX[k],CH[k]]),['wide',pad.wide,6,'w']];for(const[k,v,m,c]of A)if(v>0){x.fillStyle='rgba(0,0,0,.5)';rr(cx,56,64,16,6);x.fillStyle=PC[c];x.fillText(k.toUpperCase()+' '+Math.ceil(v),cx+5,67);x.fillRect(cx+4,69,56*Math.min(1,v/m),2);cx+=68}}
if(banner>0&&st=='play'){x.globalAlpha=Math.min(1,banner*2);x.textAlign='center';x.font='900 italic 46px "Trebuchet MS",sans-serif';x.fillStyle='#ff3d7f';x.fillText(bannerTxt,W/2+3,H/2+3);x.fillStyle='#ffc531';x.fillText(bannerTxt,W/2,H/2);x.globalAlpha=1}
if(st=='play'&&balls[0]&&balls[0].stuck){x.textAlign='center';x.font='bold 15px sans-serif';x.fillStyle='rgba(255,244,224,.8)';x.fillText('Tap or press Space to launch',W/2,pad.y-60)}}
/* ---------- loop ---------- */
let last=0;
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.033,(now-last)/1000||.016);last=now;T+=dt;
if(tsT>0){tsT-=dt;if(tsT<=0)ts=1}
const d=dt*ts;
if(st=='play'){upd(d);}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.l-=dt;if(p.l<=0)parts.splice(i,1)}
for(let i=bolts.length-1;i>=0;i--){bolts[i].l-=dt;if(bolts[i].l<=0)bolts.splice(i,1)}
for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.y-=40*dt;t.l-=dt*1.1;if(t.l<=0)texts.splice(i,1)}

render()}

pb.onclick=pause;
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'){return}

keys[e.key]=1;const k=e.key;
if([' ','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();

else if(k=='p'||k=='P'||k=='Escape')pause();
else if((k=='r'||k=='R'||k=='Enter')&&(st=='over'||st=='pause'||(st=='play'&&k!='Enter')))start()});

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(name,o){o=o||{};if(st!='pause'&&st!='over'&&name!='over'&&name!='cont'&&name!='ad')st='menu';ui.classList.remove('h');pb.style.display='none';const p=prof();let h='';
if(name=='menu'){const best=Math.max(0,...scores.map(s=>s.s));
h=`<div class="card"><h1><small>3D</small>BRICKS<br>BLAST</h1><p>Smash bricks. Chain bombs. Grab coins.</p>${wel?(wel=0,'<p class="coin">Welcome! 2500 free coins added to your wallet.</p>'):''}
<p>${sess?'Signed in as <b>'+esc(sess)+'</b>':'Playing as guest'} · <span class="coin">● ${p.coins}</span> · Best ${best}</p>
<button class="btn p" data-a="play" autofocus>PLAY</button>
<div class="row">${DFS.map((d,i)=>`<button class="btn ${i==dif?'':'g'}" data-a="df" data-i="${i}" style="font-size:.85em;padding:.5em">${d.n}</button>`).join('')}</div><p>Difficulty: <b>${DFS[dif].n}</b> · score ×${DFS[dif].m}</p>
<div class="row">${['fire','laser','shield'].map(k=>{const n=(p.bo||{})[k]|0,on=n&&p.sel&&p.sel[k];return `<button class="btn ${on?'':'g'}" data-a="tg" data-k="${k}" style="font-size:.8em;padding:.5em">${k} ×${n}${on?' ON':''}</button>`}).join('')}</div>
<div class="row"><button class="btn g" data-a="shop">Shop</button><button class="btn g" data-a="lb">Leaderboard</button></div>
${sess?'<button class="btn g" data-a="out">Sign out</button>':'<div class="row"><button class="btn g" data-a="in">Sign in</button><button class="btn g" data-a="up">Sign up +2500 ●</button></div>'}
<p>Drag, tap or use ← → / A D · Space launches · P pauses</p><div class="pg">${Object.entries(PN).map(([k,n])=>`<span><b style="background:${PC[k]}">${k.toUpperCase()}</b>${n}</span>`).join('')}</div></div>`}
else if(name=='in'||name=='up'){const up=name=='up';h=`<div class="card"><h2>${up?'Create account':'Sign in'}</h2>
<input id="un" placeholder="Username" maxlength="14" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="${up?'new-password':'current-password'}">
<div class="err" id="er"></div><button class="btn p" data-a="${up?'doup':'doin'}">${up?'Sign up':'Sign in'}</button><button class="btn g" data-a="menu">Back</button>
<p>Accounts are stored on this device only. ${up?'New accounts get 2500 free coins, plus any guest coins you already have.':''}</p></div>`}
else if(name=='shop'){h=`<div class="card"><h2>Shop</h2><p>Balance: <span class="coin">● ${p.coins}</span></p>`;
PACKS.forEach((k,i)=>h+=`<div class="shop"><span><b class="coin">● ${k[0]}</b> coins</span><button class="btn" data-a="pack" data-i="${i}">$${k[1]}</button></div>`);
SK.forEach((s,i)=>{const own=p.own.includes(i);h+=`<div class="shop"><span><i class="dot" style="background:linear-gradient(135deg,${s.a},${s.b})"></i>${s.n}</span>${own?`<button class="btn g" data-a="skin" data-i="${i}">${p.skin==i?'Equipped':'Equip'}</button>`:`<button class="btn" data-a="skin" data-i="${i}">● ${s.p}</button>`}</div>`});
[['fire','Fireball start',60],['laser','Laser start',80],['shield','Shield start',50]].forEach(([k,n,c])=>h+=`<div class="shop"><span>${n} · own ${(p.bo||{})[k]|0}</span><button class="btn" data-a="bo" data-k="${k}" data-c="${c}">● ${c}</button></div>`);

else if(name=='lb'){h=`<div class="card"><h2>Leaderboard</h2>`;

else if(name=='over'){const rank=scores.findIndex(s=>s.s==score)+1;h=`<div class="card"><h2>Game over</h2><p class="big">${score}</p>

<p><span class="coin">+${run+o.bonus} coins</span> earned this run</p>
<button class="btn p" data-a="play" autofocus>Play again</button><div class="row"><button class="btn g" data-a="lb">Scores</button><button class="btn g" data-a="shop">Shop</button></div><button class="btn g" data-a="quit">Main menu</button><p>Press Space or R to restart instantly</p></div>`}
ui.innerHTML=h;ui.dataset.s=name;const f=ui.querySelector('[autofocus]');if(f)f.focus({preventScroll:true})}
let wel=0;const err=m=>{const e=$('#er');if(e)e.textContent=m};
const A={play:()=>start(),menu:()=>show('menu'),quit:()=>{st='menu';show('menu')},resume,in:()=>show('in'),up:()=>show('up'),shop:()=>show('shop'),lb:()=>show('lb'),
