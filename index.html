<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>The Brick Blast</title>
<style>
:root{--ink:#fff4e0;--hot:#ff3d7f;--ice:#2ff3e0;--sun:#ffc531;--night:#0a0520}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05020f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:var(--ink)}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative}
canvas{display:block;border-radius:.6em}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1em;background:rgba(8,3,26,.78);backdrop-filter:blur(3px);border-radius:.6em;overflow:auto}
#ui.h{display:none}
.card{width:100%;max-width:25em;text-align:center}
h1{font-size:2.5em;line-height:.9;margin:.1em 0 .25em;letter-spacing:-.03em;font-weight:900;font-style:italic;color:var(--sun);text-shadow:.06em .06em 0 var(--hot),.12em .12em 0 #6a1b6e,0 0 .8em rgba(255,61,127,.5)}
h1 small{display:block;font-size:.45em;color:var(--ice);text-shadow:none;letter-spacing:.3em}
h2{font-size:1.8em;margin:.2em 0 .5em;font-style:italic;color:var(--sun)}
p{margin:.4em 0;opacity:.85;font-size:.9em}
.btn{display:block;width:100%;margin:.45em 0;padding:.8em;border:0;border-radius:.7em;font:inherit;font-weight:800;font-size:1.05em;color:#240838;background:var(--sun);box-shadow:0 .28em 0 #b9801a;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(.22em);box-shadow:0 .06em 0 #b9801a}
.btn.p{background:var(--hot);color:#fff;box-shadow:0 .28em 0 #9c1850;font-size:1.3em}
.btn.p:active{box-shadow:0 .06em 0 #9c1850}
.btn.g{background:#2a1a5c;color:var(--ink);box-shadow:0 .28em 0 #150b34}
.btn.g:active{box-shadow:0 .06em 0 #150b34}
.btn:focus-visible,input:focus-visible,#pb:focus-visible{outline:.15em solid var(--ice);outline-offset:.1em}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:.5em}.row .btn{margin:.45em 0}
input{width:100%;margin:.35em 0;padding:.75em;border-radius:.6em;border:.1em solid #5a3fb0;background:#160a3a;color:var(--ink);font:inherit;font-size:1em}
.err{color:#ff8fa8;min-height:1.3em;font-size:.85em}
table{width:100%;border-collapse:collapse;font-size:.95em}
td,th{padding:.4em .3em;text-align:left;border-bottom:.06em solid #3a2880}
td:last-child,th:last-child{text-align:right}
tr.me td{color:var(--sun);font-weight:800}
.coin{color:var(--sun);font-weight:800}
.shop{display:flex;justify-content:space-between;align-items:center;background:#1d1046;border-radius:.7em;padding:.5em .7em;margin:.4em 0;text-align:left;font-size:.9em}
.shop .btn{width:auto;margin:0;padding:.45em .8em;font-size:.95em}
.dot{display:inline-block;width:1em;height:1em;border-radius:50%;vertical-align:-.15em;margin-right:.4em}
#pb{position:absolute;top:.3em;right:.4em;width:2.2em;height:2.2em;border:0;border-radius:.6em;background:#2a1a5c;color:var(--ink);font-size:1em;cursor:pointer;display:none}
.big{font-size:3.2em;font-weight:900;color:var(--sun);font-style:italic;margin:0}
.card{background:linear-gradient(160deg,rgba(70,30,130,.6),rgba(18,7,48,.8));border:.07em solid rgba(255,255,255,.16);border-radius:1.1em;padding:1em;box-shadow:0 .8em 2em rgba(0,0,0,.5)}
h1{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-.1em) rotate(-1.2deg)}}
.btn{position:relative;overflow:hidden}.btn::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}.btn:hover{filter:brightness(1.1)}
.btn.p{animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{box-shadow:0 .28em 0 #9c1850,0 0 1.3em rgba(255,61,127,.8)}}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:.3em;font-size:.7em;margin:.5em 0;text-align:left}.pg span{background:#1d1046;border-radius:.5em;padding:.3em}.pg b{display:inline-block;width:1.6em;height:1.6em;line-height:1.6em;border-radius:.4em;color:#160a3a;margin-right:.3em;text-align:center}
.btn.gb{background:#fff;color:#3c4043;box-shadow:0 .28em 0 #aeb2b8}.btn.gb:active{box-shadow:0 .06em 0 #aeb2b8}.btn.gb b{font-size:1.15em;margin-right:.4em}
.mp{display:grid;grid-template-columns:repeat(5,1fr);gap:.4em;margin:.6em 0}.mp .btn{padding:.6em 0;margin:0;font-size:1.15em}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1em;background:radial-gradient(circle at 50% 35%,#3a1380,#0a0520 70%);transition:opacity .5s;cursor:pointer;color:var(--ink);text-align:center}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(34vw,34vh,180px);border-radius:22%;animation:pop .9s cubic-bezier(.2,1.6,.4,1) both,fl 3s 1s ease-in-out infinite;box-shadow:0 0 2.5em rgba(255,61,127,.6)}
#splash h1{font-size:clamp(2rem,9vmin,3.4rem);margin:0}
#splash .bar{width:min(60vw,260px);height:.55rem;background:#1d1046;border-radius:1rem;overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--hot),var(--sun));animation:ld 1.8s ease-out forwards}
#splash p{margin:0;font-weight:800;letter-spacing:.25em;font-size:.8rem;opacity:0;animation:bl 1s 1.8s infinite alternate}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}}
@keyframes ld{to{width:100%}}
@keyframes bl{from{opacity:.3}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#splash .bar i{animation:none;width:100%}#splash p{animation:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.btn,h1,.btn.p{transition:none;animation:none}}
</style></head><body>
